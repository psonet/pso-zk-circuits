# CI + release pipeline for pso-zk-circuits (resolve -> check/test ->
# tag -> publish-crates-io -> github-release). A library workspace —
# no deployable binary.
#
# Two crates: `pso-zk-canonical` (the publishable, no-toolchain
# crate — builds from committed frozen artifacts) and `pso-zk-backend`
# (`publish = false`: pulls the noir toolchain via git + links C++
# barretenberg via FFI, so only consumed as a workspace/git dep). The
# mobile FFI surface lives in the downstream UniFFI wallet crate, not here.
#
# Triggers:
#   push:main         full pipeline incl. cog auto-bump
#   pull_request      check / test only
#   push:tags:["v*"]  release-only path; publish + github-release for the tag
#   workflow_dispatch with `tag` input: maintainer-named re-release;
#                     empty input runs the normal main pipeline
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to (re-)release (e.g. "v0.1.0"). Empty input
          runs the normal main pipeline.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # --------------------------------------------------------------
  # Mode prelude. Every other job's `if:` reads `release_tag`.
  # --------------------------------------------------------------
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.r.outputs.release_tag }}
    steps:
      - id: r
        run: |
          set -euo pipefail
          tag=""
          case "${{ github.event_name }}" in
            push)
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                tag="${{ github.ref_name }}"
              fi
              ;;
            workflow_dispatch)
              tag='${{ inputs.tag }}'
              ;;
          esac
          echo "release_tag=${tag}"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------
  # Supply-chain enforcement. Runs on every PR + nightly cron @ 04:00 UTC.
  # Independent of the rest of the pipeline so a fresh advisory surfacing
  # nightly is visible without rerunning the noir-heavy check job.
  #
  # Runs cargo-deny on the host (not the EmbarkStudios container
  # action) so cargo-metadata can use the host's git config to
  # fetch the workspace's git deps. The only one left is the public
  # `https://github.com/noir-lang/noir` — pso-protocol resolves from
  # crates.io now — so no PAT or credential helper is needed.
  # --------------------------------------------------------------
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite ssh:// psonet git URLs to https://
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: cargo

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check all
        run: cargo deny check all

  # --------------------------------------------------------------
  # Which parts of the tree moved. The freeze check installs the Noir
  # toolchain and derives nine verifying keys, so it is gated on the
  # inputs that can actually change a key: the .nr sources, the frozen
  # artifacts, the manifest, the toolchain pins, and xtask itself.
  # Always runs on a push to main, where "nothing relevant changed" is
  # not a risk worth taking.
  # --------------------------------------------------------------
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      circuits: ${{ steps.filter.outputs.circuits }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            circuits:
              - 'crates/pso-zk-canonical/noir/**'
              - 'crates/pso-zk-canonical/resources/circuits/**'
              - 'crates/pso-zk-canonical/circuits/manifest.toml'
              - 'xtask/**'
              - 'mise.toml'

  # --------------------------------------------------------------
  # The reproduction gate: every committed `active` artifact must come
  # back byte-identical from its own sources under the pinned toolchain.
  # This is what makes the frozen registry a claim anyone can re-derive
  # rather than a set of files someone once generated.
  #
  # The dry run compiles a scratch copy under target/, so the checkout
  # must be untouched afterwards — asserted below, because an xtask bug
  # that wrote into the tree would otherwise pass silently.
  # --------------------------------------------------------------
  freeze-check:
    name: freeze check
    runs-on: ubuntu-latest
    needs: [resolve, changes]
    if: |
      needs.resolve.outputs.release_tag == '' &&
      (needs.changes.outputs.circuits == 'true' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: jdx/mise-action@v4
        with:
          install: false

      # nargo and bb come from noirup/bbup at the mise.toml pins. Reusing the
      # repo's own task rather than repeating the installer here keeps one
      # source of truth; xtask then re-asserts both versions before compiling,
      # so a drift fails fast and by name rather than as a key mismatch at the
      # end. Restored from cache when the pins have not moved.
      - name: Cache the Noir toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nargo
            ~/.bb
          key: noir-toolchain-${{ hashFiles('mise.toml') }}

      - name: Install nargo + bb at the pinned versions
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: mise run install:zk-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: freeze-check

      # The Aztec CRS is large and identical between runs. Keyed on mise.toml
      # because a bb bump is the thing that can invalidate it. Path per
      # `barretenberg::srs::local_g1_path`.
      - name: Cache the bb CRS
        uses: actions/cache@v4
        with:
          path: ~/.bb-crs
          key: bb-crs-${{ hashFiles('mise.toml') }}

      - name: cargo xtask freeze-circuits --check
        run: cargo xtask freeze-circuits --check

      - name: the dry run wrote nothing
        run: git diff --exit-code

  # --------------------------------------------------------------
  # Format + clippy + cargo test on stable & beta. Runs on PR +
  # push:main; skipped on tag-push / workflow_dispatch release
  # paths because the underlying main commit already ran them
  # before the tag was cut.
  # --------------------------------------------------------------
  check:
    name: cargo fmt + clippy + test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.release_tag == '' && !startsWith(github.event.head_commit.message, 'chore(version):') && !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install C++ toolchain (barretenberg-rs build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang \
            libstdc++-12-dev \
            libc++-dev libc++abi-dev \
            pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache slot per toolchain so stable + beta don't
          # clobber each other.
          key: ${{ matrix.rust }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -D clippy::todo \
            -D clippy::unimplemented \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc

      - name: cargo test --workspace
        run: cargo test --workspace

  # --------------------------------------------------------------
  # Version bump + tag. Only on push:main, only after `check` is
  # green. Independent of the mobile build jobs — those are
  # best-effort and shouldn't block release cuts on barretenberg-rs
  # cross-toolchain regressions.
  # --------------------------------------------------------------
  # Spelling. Cheap, no toolchain. The allow-list in typos.toml holds only
  # checked false positives, so a hit here is worth reading.
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.50.2
        with:
          config: ./typos.toml

  # pso-zk-canonical publishes to crates.io and the chain pins it.
  semver:
    name: semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # A version never published yet has no baseline; that is a skip, not a
      # failure. `--workspace` follows whatever the manifests mark publishable,
      # so adding a crate does not mean editing this line.
      - run: cargo semver-checks check-release --workspace --all-features

  # Cargo features declared on a workspace crate but not propagated to a
  # dependency exposing the same one. Builds cleanly today and silently
  # compiles that dependency in the wrong shape.
  zepter:
    name: zepter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # No install-action manifest for zepter, so it builds from source.
      - run: cargo install zepter --locked --version ^0.13
      - run: cargo metadata --format-version=1 --all-features --locked > /dev/null
      - run: zepter run check

  # Coverage. Reported, never enforced: a threshold set before anyone has seen
  # the number is a guess. Deliberately outside the `ci` aggregator's needs, so
  # a slow or failed coverage run cannot hold up a merge.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path lcov.info

      # `--summary-only` prints a fixed-width table meant for a terminal, which
      # renders as a wall of unaligned text in Markdown. Read the JSON instead.
      - name: Render coverage report
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          python3 .github/scripts/coverage_report.py coverage.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      # One comment rewritten in place on each push; `header` makes it sticky.
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage.md

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json
            coverage.md
          retention-days: 14

  # One required status for branch protection. Without it, adding a job means
  # editing the protected-branch settings too, and a job skipped for a
  # legitimate reason reads as "pending" forever. Fails when any dependency
  # failed or was cancelled; tolerates a skip.
  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always()
    needs: [cargo-deny, check, freeze-check, typos, semver, zepter]
    steps:
      - name: Check dependency results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
          echo "all required jobs succeeded or were skipped"

  tag:
    name: Bump version & tag
    runs-on: ubuntu-latest
    # freeze-check too: cutting a tag whose committed keys do not re-derive
    # would publish a registry nobody can reproduce, which is the one failure
    # this repository exists to prevent. It always runs on a push to main, so
    # it can never be skipped out from under this.
    needs: [resolve, ci] # resolve for its outputs; ci is the gate
    if: needs.resolve.outputs.release_tag == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(version):') && !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cocogitto bump
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve created tag (if any)
        id: bump
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          echo "tag=${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------
  # crates.io publish. Fires after `tag` produces a fresh tag, OR
  # when re-releasing an existing tag via workflow_dispatch /
  # tag-push. Publishes one crate: `pso-zk-canonical`.
  #
  # `xtask` and `pso-zk-backend` are both `publish = false` and are
  # skipped — the backend pulls the noir toolchain over git refs that
  # crates.io cannot resolve.
  #
  # `continue-on-error: true` so a transient flake (crates.io index
  # latency, or a missing upstream registry dep on first run) doesn't
  # block the GitHub release — the other artifacts still ship even if
  # crates.io rejects the publish. Note this also swallows a failure of
  # the patch guard below, which is why that guard runs before the
  # publish step rather than gating the job.
  # --------------------------------------------------------------
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [resolve, check, tag]
    if: |
      always() &&
      (needs.tag.result == 'success' && needs.tag.outputs.tag != '' ||
       needs.resolve.outputs.release_tag != '')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || needs.resolve.outputs.release_tag }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: cargo

      # A `[patch.*]` section is a development-only redirect: `cargo publish`
      # strips it, and `--no-verify` below skips the build that would notice.
      # Publishing under one ships a crate whose green CI proved something
      # about a patched graph and nothing about the graph users get — the
      # requirement in Cargo.toml resolves to whatever is on the registry,
      # which is the version the patch existed to avoid. Fail loudly instead;
      # the fix is to bump the requirement and delete the patch before tagging.
      - name: Refuse to publish under a dependency patch
        run: |
          set -euo pipefail
          if grep -q '^\[patch\.' Cargo.toml; then
            echo "::error::Cargo.toml still has a [patch.*] section. Bump the real"
            echo "::error::version requirement and delete the patch, then re-tag."
            grep -n '^\[patch\.' -A3 Cargo.toml
            exit 1
          fi
          echo "no dependency patches; safe to publish"

      # Only `pso-zk-canonical` ships to crates.io. `pso-zk-backend`
      # is `publish = false` — it pulls the noir toolchain via git refs that
      # crates.io cannot resolve, so it is consumed only as a workspace/git dep.
      - name: Publish pso-zk-canonical
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish -p pso-zk-canonical --token "${CARGO_REGISTRY_TOKEN}" --no-verify

      # Re-create the .crate locally so the `github-release` job can
      # attach the byte-identical tarball. `cargo publish` cleans up
      # target/package/*.crate after a successful upload; `cargo
      # package --no-verify -p pso-zk-canonical` is fast and
      # deterministic given the same source.
      - name: Re-package pso-zk-canonical .crate for artifact upload
        if: success()
        run: cargo package --no-verify -p pso-zk-canonical

      - name: Upload .crate as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crate-tarball
          path: target/package/pso-zk-canonical-*.crate
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------
  # Release. Gated on `tag.outputs.tag != ''` (cog bumped on main
  # push) OR `resolve.outputs.release_tag != ''` (manual tag push /
  # workflow_dispatch). Downloads every artifact produced by the
  # mobile build jobs (whichever succeeded) and attaches them all
  # to the release.
  # --------------------------------------------------------------
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [resolve, tag, publish-crates-io]
    if: |
      always() &&
      (needs.tag.result == 'success' && needs.tag.outputs.tag != '' ||
       needs.resolve.outputs.release_tag != '')
    # id-token + attestations widen this job's scope so cosign keyless +
    # actions/attest-build-provenance can mint an OIDC token and write to
    # the GitHub attestation store. Workflow-level perms stay narrower.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || needs.resolve.outputs.release_tag }}

      - name: Download pso-zk-canonical .crate artifact
        if: needs.publish-crates-io.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: crate-tarball
          path: artifacts/crate/

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          mkdir -p release/
          shopt -s nullglob
          # pso-zk-canonical .crate — byte-identical to the
          # crates.io upload, attached for downstream consumers that
          # prefer GitHub-hosted artifacts.
          for f in artifacts/crate/pso-zk-canonical-*.crate; do
            cp "$f" "release/$(basename "$f")"
          done
          # SHA256SUMS over everything in release/ — the signing
          # pipeline (T-0020) hashes this same set.
          if [ -n "$(ls -A release/ 2>/dev/null)" ]; then
            cd release
            shasum -a 256 * > SHA256SUMS
            echo "---"
            cat SHA256SUMS
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "(no artifacts assembled)"
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.stage.outputs.has_artifacts == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # pin-target: v3

      # Signs whatever made it into release/: the .crate and SHA256SUMS.
      # `publish-crates-io` is continue-on-error and the crate is staged only
      # if it succeeded, so "nothing to sign" is a reachable state — see
      # verify-release, which fails on it. Skips any pre-existing .sig/.pem.
      - name: Sign release artifacts (cosign keyless)
        if: steps.stage.outputs.has_artifacts == 'true'
        run: |
          set -euo pipefail
          cd release
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sig|*.pem) continue ;; esac
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la

      # SLSA build provenance for every artifact in release/ (except
      # sigs/certs). Glob expansion picks up whichever mobile slices
      # built successfully — missing slices contribute zero subjects.
      - name: Generate SLSA build provenance
        if: steps.stage.outputs.has_artifacts == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # pin-target: v2
        with:
          subject-path: |
            release/*.crate
            release/*.a
            release/*.so
            release/*.zip
            release/SHA256SUMS

      - name: Compose release body
        env:
          TAG: ${{ needs.tag.outputs.tag || needs.resolve.outputs.release_tag }}
          PUBLISH_RESULT: ${{ needs.publish-crates-io.result }}
        run: |
          set -euo pipefail
          {
            echo "## Install (Rust)"
            echo
            echo "    cargo add pso-zk-canonical@${TAG#v}"
            echo
            echo "## Artifacts"
            echo
            echo "### crates.io"
            echo
            echo "- \`pso-zk-canonical-${TAG#v}.crate\` — byte-identical to the crates.io upload."
            echo
            echo "### Verification"
            echo
            echo "- \`SHA256SUMS\` — SHA-256 of every other file attached to this release."
            echo "- \`*.sig\` + \`*.pem\` — sigstore cosign keyless signature + Fulcio cert per artifact."
            echo "- See [SECURITY.md](https://github.com/psonet/pso-zk-circuits/blob/main/SECURITY.md) for the verify recipe."
            echo
            echo "## CI"
            echo
            echo "- crates.io publish: ${PUBLISH_RESULT}"
          } > body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag || needs.resolve.outputs.release_tag }}
          body_path: body.md
          generate_release_notes: true
          files: |
            release/*
          fail_on_unmatched_files: false

  # ----------------------------------------------------------------
  # verify-release: post-publish smoke test. Re-downloads every asset
  # of the release we just cut and runs `cosign verify-blob` against
  # each one. Hard-fails the workflow on any bad signature. Tolerates
  # the matrix-aware artifact set — only verifies pairs that actually
  # exist on the release.
  # ----------------------------------------------------------------
  verify-release:
    name: Verify signed release
    runs-on: ubuntu-latest
    needs: [resolve, tag, github-release, publish-crates-io]
    if: |
      always() &&
      needs.github-release.result == 'success' &&
      (needs.tag.result == 'success' && needs.tag.outputs.tag != '' ||
       needs.resolve.outputs.release_tag != '')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # pin-target: v3

      - name: Download release assets
        env:
          TAG: ${{ needs.tag.outputs.tag || needs.resolve.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --dir verify --repo "${{ github.repository }}"
          ls -la verify/

      - name: Verify cosign signatures
        env:
          TAG: ${{ needs.tag.outputs.tag || needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd verify
          IDENTITY_RE='^https://github\.com/psonet/pso-zk-circuits/\.github/workflows/ci\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$'
          OIDC_ISSUER='https://token.actions.githubusercontent.com'
          failed=0
          verified=0
          shopt -s nullglob
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sig|*.pem) continue ;; esac
            if [ ! -f "${f}.sig" ] || [ ! -f "${f}.pem" ]; then
              echo "::error::missing ${f}.sig or ${f}.pem alongside ${f}"
              failed=1
              continue
            fi
            echo "Verifying $f"
            if cosign verify-blob \
                --certificate "${f}.pem" \
                --signature "${f}.sig" \
                --certificate-identity-regexp "$IDENTITY_RE" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                "$f"; then
              echo "  OK $f"
              verified=$((verified + 1))
            else
              echo "::error::cosign verify-blob FAILED for $f"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more release artifacts failed signature verification"
            exit 1
          fi
          if [ "$verified" -eq 0 ]; then
            echo "::error::no signed artifacts found on the release"
            exit 1
          fi
          echo "Verified $verified artifact(s)."
