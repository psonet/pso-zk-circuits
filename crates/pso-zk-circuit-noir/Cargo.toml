[package]
name = "pso-zk-circuit-noir"
version.workspace = true
edition = "2021"
description = "Noir circuit implementation for ZK proofs - ownership and Merkle inclusion"
license = "Apache-2.0"
repository = "https://github.com/psonet/pso-zk-circuits"

# Mobile-loadable library shapes for the CI build-ios / build-android
# jobs. `staticlib` produces the `.a` consumed by the iOS xcframework;
# `cdylib` produces the `.so` consumed by Android's NDK loader. `rlib`
# keeps the crate usable as a normal cargo workspace dep for all the
# rust callers (xtask, pso-zk-canonical tests, the desktop prover
# integration tests).
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Witness types, hash formulas, and consensus-binding primitives.
pso-protocol = { workspace = true }

# Noir integration via noir-rs. Sourced from the psonet fork
# (chore/align-barretenberg-version-with-noir is the source branch),
# which bumps barretenberg-rs to 5.0.0-nightly.20260512 to share a
# single C++ backend with the prove path. Tracks an open PR back to
# upstream zkpassport/noir_rs; flip to the upstream tag once that
# lands. Pinned by `rev` rather than branch so the dep doesn't slide
# on `cargo update`. `version = "=1.0.0-beta.20"` pins the exact
# prerelease for cargo-deny's wildcard check.
noir_rs = { version = "=1.0.0-beta.20", git = "https://github.com/psonet/noir_rs", rev = "9c206b22cd702373751dbab20501815090d6d7ba", features = ["barretenberg"] }
barretenberg-rs = { workspace = true }
anyhow.workspace = true
# Hex encoding for bytecode
bs58.workspace = true

serde_json.workspace = true

# Used by the `testing` module (Grumpkin keypair generation, witness
# builders). It's a pub mod, not feature-gated, because integration
# tests and benches in this crate use it and Cargo doesn't offer a
# clean way to expose a `cfg(test)` module to `tests/*.rs`. Runtime
# cost is negligible next to barretenberg-rs.
ark-ff     = { workspace = true }
ark-bn254  = { workspace = true }
rand       = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Used by `examples/measure_pk.rs` to read peak macOS RSS.
libc = "0.2"
# Used by `examples/measure_pk_rolluphonk.rs` for direct barretenberg-rs
# calls (Grumpkin SRS + IPA-accumulation circuit_compute_vk).
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking"] }
# Canonical descriptors (circuit_hash + canonical VK bytes). Used by
# the aggregation integration tests so they verify against the same
# VK that the on-chain `zk_verify` precompile consumes.
pso-zk-canonical.workspace = true

[[bench]]
name = "proof_perf"
harness = false

[features]
# Enable round-trip tests for tier sizes N >= 4. Default off because
# each tier prove+verify takes tens of seconds (N=64 several minutes)
# under barretenberg, which would balloon a normal `cargo test` run.
aggregation-full-tiers = []
