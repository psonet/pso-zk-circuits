[package]
name = "pso_circuit_core"
type = "lib"
authors = ["outbe"]
# Bumped to 1.0.0 — `bb_proof_verification` requires Noir 1.x. The
# noir_rs Rust prover (v1.0.0-beta.20-1) already lives on this
# compiler family.
compiler_version = ">=1.0.0"

[dependencies]
poseidon = { tag = "v0.3.0", git = "https://github.com/noir-lang/poseidon" }
# In-circuit Honk proof verification. Used by the `recursion` module
# to fold N per-SU ownership proofs into one recursive aggregation
# proof — see PDF §5.2 and `docs/aggregation-redesign.md` in
# psonet/pso-integration.
bb_proof_verification = { tag = "v4.1.1", git = "https://github.com/AztecProtocol/aztec-packages", directory = "barretenberg/noir/bb_proof_verification" }
