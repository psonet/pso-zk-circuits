[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/psonet/pso-zk-circuits"

[workspace]
members = [
    "crates/pso-zk-backend",
    "crates/pso-zk-canonical",
    "xtask",
]
resolver = "2"

# Centralized versions for every non-git dependency. Members opt in with
# `{ workspace = true }`. The noir git deps (acir / acvm / bn254_blackbox_solver)
# are NOT here — they stay inline in `pso-zk-backend` with their `tag = ...`.
[workspace.dependencies]
pso-protocol  = "0.8"
ark-ff        = { version = "0.6", default-features = false }
ark-bn254     = { version = "0.6", default-features = false, features = ["curve"] }
ark-std       = { version = "0.6", default-features = false }
hex-literal   = "0.4"
base64        = "0.22"
flate2        = "1"
# barretenberg via FFI; the bb CLI used by `xtask freeze-circuits` must match
# this exact version (see mise `install:bb`).
barretenberg-rs = { version = "=5.0.0-nightly.20260522", default-features = false, features = ["ffi"] }
reqwest       = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2          = { version = "0.10", default-features = false }
serde_json    = "1"
tiny-keccak   = { version = "2", features = ["keccak"] }
toml          = "0.8"
toml_edit     = "0.22"
criterion     = { version = "0.5", default-features = false }
# Single-producer reply channel for the bb-worker: its Receiver is both
# blockable (`recv()`, sync callers) and awaitable (`async` feature, async
# callers), so the backend stays runtime-agnostic (no tokio dependency).
oneshot       = { version = "0.1", default-features = false, features = ["std", "async"] }
# Minimal current-thread block_on: the generic `RawVerifier` blanket (which
# can't name the async trait's future to call `BbReply::recv`) uses it to derive
# the sync seam from the async one. Not an async runtime — just a poll loop.
pollster      = "0.4"

# Dev / testing: opt-level 3 keeps Noir proving times sane (debug
# proving is otherwise extremely slow).
[profile.dev]
opt-level = 3
debug = 2
overflow-checks = true
incremental = true

[profile.local]
inherits = "dev"
opt-level = 3
debug = 2
debug-assertions = false
panic = 'unwind'
incremental = true
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
