[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/pso-zk-circuit-noir",
    "crates/pso-zk-canonical",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
# Internal crates
pso-zk-circuit-noir = { path = "crates/pso-zk-circuit-noir" }
pso-zk-canonical    = { path = "crates/pso-zk-canonical" }

# Shared consensus-binding primitives. Path-pinned during sibling
# development; flip to `version = "0.1"` from crates.io once published.
pso-protocol = { path = "../pso-protocol" }

# External
pso-poseidon = "0.2"
k256 = { version = "0.14.0-rc.8", features = ["std"] }
ark-ff       = { version = "0.5", features = ["asm", "parallel"] }
ark-bn254    = { version = "0.5", features = ["default"] }
bs58 = "0.5"
rand = "0.8"
thiserror = "1.0"
barretenberg-rs = { version = "=5.0.0-nightly.20260512", default-features = false, features = ["ffi"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
generic-array = "0.14"
clap = { version = "4", features = ["derive"] }
hex = "0.4"

# Dev / testing mode. We make opt-level = 3 to improve proving times
# (otherwise it is really slow).
[profile.dev]
opt-level = 3
debug = 2
overflow-checks = true
incremental = true

[profile.local]
inherits = "dev"
opt-level = 3
debug = 2
debug-assertions = false
panic = 'unwind'
incremental = true
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
