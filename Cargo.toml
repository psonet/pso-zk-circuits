[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/pso-zk-circuit-noir",
    "crates/pso-zk-canonical",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
# Internal crates. The `version` field alongside `path` is required
# by cargo-deny's wildcard check for publishable crates — cargo
# prefers the path dep for local dev and the version takes effect
# when these crates are consumed off crates.io.
pso-zk-circuit-noir = { version = "0.1", path = "crates/pso-zk-circuit-noir" }
pso-zk-canonical    = { version = "0.1", path = "crates/pso-zk-canonical" }

# Shared consensus-binding primitives. Tracked against the
# `main` branch while both repos co-evolve; pin to a specific
# rev or tag at release time. The `version = "0.1"` alongside
# the git ref satisfies cargo-deny's wildcard check and is
# forward-compatible with the eventual flip to a pure crates.io
# dep once `pso-protocol` is published.
pso-protocol = { version = "0.1", git = "ssh://git@github.com/psonet/pso-protocol.git", branch = "main" }

# External
pso-poseidon = "0.2"
k256 = { version = "0.14.0-rc.8", features = ["std"] }
ark-ff       = { version = "0.5", features = ["asm", "parallel"] }
ark-bn254    = { version = "0.5", features = ["default"] }
bs58 = "0.5"
rand = "0.8"
thiserror = "1.0"
barretenberg-rs = { version = "=5.0.0-nightly.20260512", default-features = false, features = ["ffi"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
generic-array = "0.14"
clap = { version = "4", features = ["derive"] }
hex = "0.4"

# Dev / testing mode. We make opt-level = 3 to improve proving times
# (otherwise it is really slow).
[profile.dev]
opt-level = 3
debug = 2
overflow-checks = true
incremental = true

[profile.local]
inherits = "dev"
opt-level = 3
debug = 2
debug-assertions = false
panic = 'unwind'
incremental = true
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
overflow-checks = false
debug = false

# Local fork of noir_rs with barretenberg-rs bumped to 5.0.0-nightly.20260512.
# Required so off-chain Schnorr/Grumpkin signing via barretenberg-rs 5.x's
# `schnorr_construct_signature` shares a single C++ backend with noir_rs's
# prove path (otherwise the two RPC schemas don't agree). Mirrors the
# same git-rev pin used by `psonet/pso-chain` and `psonet/pso-integration`
# so all three downstream consumers compile against the same FFI ABI.
[patch."https://github.com/zkpassport/noir_rs"]
noir_rs = { git = "https://github.com/psonet/noir_rs.git", rev = "9c206b22cd702373751dbab20501815090d6d7ba" }
