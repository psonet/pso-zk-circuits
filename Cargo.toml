[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/psonet/pso-zk-circuits"

[workspace]
members = [
    "crates/pso-zk-backend",
    "crates/pso-zk-canonical",
    "xtask",
]
resolver = "2"

# Centralized versions for every non-git dependency. Members opt in with
# `{ workspace = true }`. The noir git deps (acir / acvm / bn254_blackbox_solver)
# are NOT here — they stay inline in `pso-zk-backend` with their `tag = ...`.
[workspace.dependencies]
pso-protocol  = "0.9"
ark-ff        = { version = "0.6", default-features = false }
ark-bn254     = { version = "0.6", default-features = false, features = ["curve"] }
ark-std       = { version = "0.6", default-features = false }
hex-literal   = "0.4"
base64        = "0.22"
flate2        = "1"
# barretenberg via FFI; the bb CLI used by `xtask freeze-circuits` must match
# this exact version (see mise `install:bb`).
barretenberg-rs = { version = "=5.0.0-nightly.20260522", default-features = false, features = ["ffi"] }
reqwest       = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2          = { version = "0.10", default-features = false }
serde_json    = "1"
tiny-keccak   = { version = "2", features = ["keccak"] }
toml          = "0.8"
toml_edit     = "0.22"
criterion     = { version = "0.5", default-features = false }

# Dev / testing: opt-level 3 keeps Noir proving times sane (debug
# proving is otherwise extremely slow).
[profile.dev]
opt-level = 3
debug = 2
overflow-checks = true
incremental = true

[profile.local]
inherits = "dev"
opt-level = 3
debug = 2
debug-assertions = false
panic = 'unwind'
incremental = true
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
overflow-checks = false
debug = false

# TEMPORARY, remove in the same pull request that lands the published release.
#
# The six-element binding lives in pso-protocol and is not on crates.io yet, so
# `pso-protocol = "0.9"` above cannot resolve to it. This patch points the whole
# graph at the branch carrying it, which is what lets CI build and test this
# change before its dependency is published.
#
# When pso-protocol releases, bump the version requirement above and delete this
# section. Leaving it in place would pin the build to a branch that can move.
[patch.crates-io]
pso-protocol = { git = "ssh://git@github.com/psonet/pso-protocol.git", branch = "feat/binding-l2-chain-id" }
