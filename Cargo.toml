[workspace.package]
version = "0.5.0"
edition = "2021"

[workspace]
members = [
    "crates/pso-zk-circuit-noir",
    "crates/pso-zk-canonical",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
# Internal crates — PATH-ONLY (no version req). A pinned `version` here
# goes stale on every release: the `chore(version)` bump raises
# `[workspace.package].version` but does NOT update these requirements,
# so `^0.N` stops matching the bumped path crate and `cargo metadata`
# /publish fail. Path-only never goes stale; cargo-deny permits it via
# `allow-wildcard-paths = true` in deny.toml. Safe to publish: noir is
# never published, and canonical (the leaf) does not depend on these
# entries when it publishes — they only gate intra-workspace resolution.
pso-zk-circuit-noir = { path = "crates/pso-zk-circuit-noir" }
pso-zk-canonical    = { path = "crates/pso-zk-canonical" }

# Shared consensus-binding primitives. Consumed from crates.io
# directly now that `pso-protocol` is published; the cargo-deny
# wildcard concern is moot for registry deps. Bumped to ^0.5 to pick
# up the consent-address SU hash (attester/referrer bound into the SU
# preimage) and the `imt` commitment-window tree module. The witness /
# merkle / ownership APIs this crate consumes are unchanged, so the
# circuits and their VKs are unaffected — only a recompile.
pso-protocol = "0.5"

# External
pso-poseidon = "0.3"
k256 = { version = "0.14.0-rc.8", features = ["std"] }
ark-ff       = { version = "0.5", features = ["asm", "parallel"] }
ark-bn254    = { version = "0.5", features = ["default"] }
bs58 = "0.5"
rand = "0.8"
thiserror = "1.0"
barretenberg-rs = { version = "=5.0.0-nightly.20260512", default-features = false, features = ["ffi"] }

# noir-lang/noir crates consumed by the vendored noir_rs proving
# glue in `pso-zk-circuit-noir/src/vendor/noir_rs/`. Pinned to the
# same `v1.0.0-beta.20` git rev that upstream noir_rs used, so the
# dependency graph is identical to pre-vendoring. Bump these
# together when chasing a new noir release. The `version` next to
# the git ref satisfies cargo-deny's wildcard check for any
# downstream consumer that flips to a [patch.crates-io] override.
acvm                  = { version = "1.0.0-beta.20", git = "https://github.com/noir-lang/noir.git", tag = "v1.0.0-beta.20", package = "acvm" }
acvm_blackbox_solver  = { version = "1.0.0-beta.20", git = "https://github.com/noir-lang/noir.git", tag = "v1.0.0-beta.20", package = "acvm_blackbox_solver" }
bn254_blackbox_solver = { version = "1.0.0-beta.20", git = "https://github.com/noir-lang/noir.git", tag = "v1.0.0-beta.20", package = "bn254_blackbox_solver" }
nargo                 = { version = "1.0.0-beta.20", git = "https://github.com/noir-lang/noir.git", tag = "v1.0.0-beta.20", package = "nargo" }

# Direct deps required by the vendored noir_rs proving glue.
# Versions match what upstream noir_rs/Cargo.toml declared.
base64  = "0.22"
flate2  = "1.0"
bincode = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
generic-array = "0.14"
clap = { version = "4", features = ["derive"] }
hex = "0.4"

# Dev / testing mode. We make opt-level = 3 to improve proving times
# (otherwise it is really slow).
[profile.dev]
opt-level = 3
debug = 2
overflow-checks = true
incremental = true

[profile.local]
inherits = "dev"
opt-level = 3
debug = 2
debug-assertions = false
panic = 'unwind'
incremental = true
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
overflow-checks = false
debug = false

